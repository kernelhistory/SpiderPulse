<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0F"/>
      <stop offset="55%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#19191E"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#232329" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#151519" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#232329" stroke-width="1"/>
    </pattern>
    <pattern id="subgrid" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#2E2E36" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Outer Background -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#32323A" stroke-width="2"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)" opacity="0.65"/>
  <rect width="1200" height="380" rx="16" fill="url(#subgrid)" opacity="0.5"/>

  <!-- Technical Frame Accents -->
  <path d="M 28 52 L 28 28 L 52 28" fill="none" stroke="#B8B8C2" stroke-width="2"/>
  <path d="M 1172 52 L 1172 28 L 1148 28" fill="none" stroke="#B8B8C2" stroke-width="2"/>
  <path d="M 28 328 L 28 352 L 52 352" fill="none" stroke="#B8B8C2" stroke-width="2"/>
  <path d="M 1172 328 L 1172 352 L 1148 352" fill="none" stroke="#B8B8C2" stroke-width="2"/>

  <!-- Top Telemetry Bar -->
  <text x="64" y="54" fill="#90909A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2.5">
    SYS.ID // COM.SPIDERPULSE.OSINT
  </text>
  <text x="1136" y="54" fill="#B8B8C2" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2" text-anchor="end">
    RELEASE BUILD // V1.3.0
  </text>
  <line x1="64" y1="68" x2="1136" y2="68" stroke="#2C2C32" stroke-width="1"/>

  <!-- Left Geometric Spider Emblem Container -->
  <g transform="translate(64, 96)">
    <rect x="0" y="0" width="188" height="188" rx="24" fill="url(#cardGrad)" stroke="#46464F" stroke-width="1.5"/>
    <circle cx="94" cy="94" r="72" fill="none" stroke="#2C2C32" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="94" cy="94" r="50" fill="none" stroke="#32323A" stroke-width="1"/>

    <!-- Stylized Precision Vector Spider Emblem -->
    <g transform="translate(94, 94)" stroke="#ECECF0" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Spider Legs (Left) -->
      <path d="M -12 -14 L -38 -42 L -56 -26" stroke-width="3.2"/>
      <path d="M -15 -4 L -48 -14 L -64 4" stroke-width="3.2"/>
      <path d="M -15 8 L -48 20 L -60 44" stroke-width="3.2"/>
      <path d="M -10 18 L -34 46 L -42 68" stroke-width="3.2"/>
      <!-- Spider Legs (Right) -->
      <path d="M 12 -14 L 38 -42 L 56 -26" stroke-width="3.2"/>
      <path d="M 15 -4 L 48 -14 L 64 4" stroke-width="3.2"/>
      <path d="M 15 8 L 48 20 L 60 44" stroke-width="3.2"/>
      <path d="M 10 18 L 34 46 L 42 68" stroke-width="3.2"/>
      <!-- Cephalothorax & Abdomen -->
      <polygon points="0,-28 -13,-12 -9,4 9,4 13,-12" fill="#ECECF0" stroke="#ECECF0" stroke-width="1.5"/>
      <polygon points="0,6 -16,20 -12,46 0,56 12,46 16,20" fill="#B8B8C2" stroke="#ECECF0" stroke-width="1.5"/>
      <!-- Center Core Cutout -->
      <circle cx="0" cy="28" r="4" fill="#121215" stroke="none"/>
    </g>
  </g>

  <!-- Primary Typography Block -->
  <g transform="translate(284, 118)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="310" height="26" rx="6" fill="#232329" stroke="#46464F" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#B8B8C2"/>
    <text x="28" y="17" fill="#ECECF0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.5">
      ANDROID OSINT AGGREGATOR ENGINE
    </text>

    <!-- Main Title -->
    <text x="0" y="76" fill="#ECECF0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      SPIDERPULSE
    </text>
    <text x="382" y="76" fill="#90909A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="24" font-weight="400" letter-spacing="2">
      // OSINT
    </text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#B4B4BE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="0.3">
      Модульная платформа криминалистического анализа IP-адресов и телефонных номеров с локальным шифрованием
    </text>

    <!-- Specification Pills -->
    <g transform="translate(0, 134)">
      <rect x="0" y="0" width="186" height="32" rx="6" fill="#18181C" stroke="#32323A" stroke-width="1"/>
      <text x="93" y="20" fill="#ECECF0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
        AES-256-GCM KEYSTORE
      </text>

      <rect x="198" y="0" width="168" height="32" rx="6" fill="#18181C" stroke="#32323A" stroke-width="1"/>
      <text x="282" y="20" fill="#ECECF0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
        SSRF &amp; TLS SHIELD
      </text>

      <rect x="378" y="0" width="168" height="32" rx="6" fill="#18181C" stroke="#32323A" stroke-width="1"/>
      <text x="462" y="20" fill="#ECECF0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
        ZERO TELEMETRY
      </text>

      <rect x="558" y="0" width="184" height="32" rx="6" fill="#18181C" stroke="#32323A" stroke-width="1"/>
      <text x="650" y="20" fill="#ECECF0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">
        JETPACK COMPOSE MD3
      </text>
    </g>
  </g>

  <!-- Bottom Telemetry Bar -->
  <line x1="64" y1="312" x2="1136" y2="312" stroke="#2C2C32" stroke-width="1"/>
  <text x="64" y="334" fill="#90909A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">
    ARCHITECTURE: KOTLIN COROUTINES // MIN SDK 26 // TARGET SDK 34 // R8 OBFUSCATED
  </text>
  <text x="1136" y="334" fill="#90909A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5" text-anchor="end">
    DESIGN SYSTEM: GRAPHITE MONOLITH
  </text>
</svg>
